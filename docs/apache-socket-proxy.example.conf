# Apache — توجيه /socket.io/ إلى Node (PM2 :3001)
# يتطلب تفعيل الوحدات:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   sudo systemctl reload apache2
#
# ضع داخل VirtualHost الخاص بـ tenant (مثلاً في laravel.conf)

<IfModule mod_proxy.c>
    ProxyPreserveHost On

    # WebSocket upgrade
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*)$ ws://127.0.0.1:3001/socket.io/$1 [P,L]

    # HTTP polling + handshake
    ProxyPass /socket.io/ http://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3001/socket.io/
</IfModule>
