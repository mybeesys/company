# Nginx — Socket.IO (/socket.io/) + Screen Player WebSocket (/ws) → Node (PM2 :3001)
# ضع داخل server { } الخاص بـ tenant، مثلاً test1.my-bee.info
#
# بعد التعديل:
#   sudo nginx -t && sudo systemctl reload nginx
#
# تحقق Socket.IO:
#   curl -I "https://test1.my-bee.info/socket.io/?EIO=4&transport=polling"
#
# تحقق Screen /ws (يجب HTTP/1.1 101 Switching Protocols):
#   curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" \
#     -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" -H "Sec-WebSocket-Version: 13" \
#     https://test1.my-bee.info/ws

location /socket.io/ {
    proxy_pass http://127.0.0.1:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Screen Player — QR pairing (raw WebSocket)
location /ws {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
